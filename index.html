    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Ecrã inicial estático: aparece de imediato (mesmo antes do JavaScript
         carregar, em redes lentas) e é substituído pela app ao arrancar. -->
    <style>
      #boot { position:fixed; inset:0; display:flex; flex-direction:column;
              align-items:center; justify-content:center; gap:18px;
              background:#12150f; color:#e9ebe3; font-family:system-ui,-apple-system,sans-serif; }
      #boot svg { width:64px; height:64px; }
      #boot .n { font-size:22px; font-weight:800; letter-spacing:-.01em; }
      #boot .n b { color:#93c264; }
      #boot .t { font-size:13px; color:#9aa292; }
      #boot .s { width:26px; height:26px; border:3px solid #2c3227; border-top-color:#93c264;
                 border-radius:50%; animation:spin 0.8s linear infinite; margin-top:6px; }
      @keyframes spin { to { transform:rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#1e5c1e"/>
          <path d="M7 22 H25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <path d="M10 26 H22" stroke="#7cc47c" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 22 V13" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <ellipse cx="16" cy="11" rx="3" ry="6" fill="#ffffff"/>
          <ellipse cx="21" cy="15" rx="2.4" ry="5" fill="#7cc47c" transform="rotate(40 21 15)"/>
          <ellipse cx="11" cy="15" rx="2.4" ry="5" fill="#7cc47c" transform="rotate(-40 11 15)"/>
        </svg>
        <div class="n">Agro<b>Conecta</b></div>
        <div class="t">A carregar…</div>
        <div class="s"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
