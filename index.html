<!DOCTYPE html>
<html lang="pt-MZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2d6a2d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgroConecta" />

    <!-- SEO -->
    <title>AgroConecta: Terrenos, produção e negócios agrícolas em Moçambique</title>
    <meta name="description" content="AgroConecta. A plataforma que liga agricultores, donos de terra e compradores em Moçambique: marketplace de terrenos e produtos, assistente agrícola, gestão de produção e negociações seguras." />
    <meta name="keywords" content="agricultura, Moçambique, marketplace, terras, cultivo, agronegócio, assistente agrícola" />
    <link rel="canonical" href="https://agroconecta.pages.dev/" />

    <!-- Partilha em redes sociais (WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgroConecta" />
    <meta property="og:locale" content="pt_MZ" />
    <meta property="og:url" content="https://agroconecta.pages.dev/" />
    <meta property="og:title" content="AgroConecta: agricultura ligada em Moçambique" />
    <meta property="og:description" content="Encontre terra, venda a sua colheita e negoceie em segurança. Marketplace, assistente agrícola e gestão de produção." />
    <meta property="og:image" content="https://agroconecta.pages.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Agricultora no seu campo, em Moçambique" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgroConecta: agricultura ligada em Moçambique" />
    <meta name="twitter:description" content="Encontre terra, venda a sua colheita e negoceie em segurança." />
    <meta name="twitter:image" content="https://agroconecta.pages.dev/og-image.jpg" />

    <!-- Dados estruturados (JSON-LD) para os motores de busca -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "AgroConecta",
          "url": "https://agroconecta.pages.dev/",
          "logo": "https://agroconecta.pages.dev/icon-512.png",
          "description": "Plataforma que liga agricultores, donos de terra e compradores em Moçambique: marketplace de terrenos e produtos, assistente agrícola, gestão de produção e negociações.",
          "areaServed": { "@type": "Country", "name": "Moçambique" }
        },
        {
          "@type": "WebSite",
          "name": "AgroConecta",
          "url": "https://agroconecta.pages.dev/",
          "inLanguage": "pt-MZ"
        }
      ]
    }
    </script>

    <!-- Tipos de letra -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Ecrã inicial estático: aparece de imediato (mesmo antes do JavaScript
         carregar, em redes lentas) e é substituído pela app ao arrancar. -->
    <style>
      #boot { position:fixed; inset:0; display:flex; flex-direction:column;
              align-items:center; justify-content:center; gap:14px;
              background:#12150f; color:#e9ebe3; font-family:system-ui,-apple-system,sans-serif; }
      #boot .scene { width:min(300px,84vw); height:auto; }
      #boot .n { font-size:22px; font-weight:800; letter-spacing:-.01em; }
      #boot .n b { color:#93c264; }
      #boot .t { font-size:13px; color:#9aa292; }

      /* Sol a pulsar */
      .b-sun { animation:b-sun 3s ease-in-out infinite; }
      @keyframes b-sun { 0%,100%{opacity:.7} 50%{opacity:1} }

      /* Plantas a crescer (em ciclo, escalonadas) */
      .b-plant { transform-box:fill-box; transform-origin:bottom center; animation:b-grow 4.5s ease-in-out infinite; }
      .b-plant.p2 { animation-delay:.7s } .b-plant.p3 { animation-delay:1.4s }
      @keyframes b-grow { 0%,6%{transform:scaleY(.04)} 45%,82%{transform:scaleY(1)} 100%{transform:scaleY(.04)} }

      /* Camião a levar a colheita, da esquerda para a direita */
      .b-truck { animation:b-drive 5.5s linear infinite; }
      @keyframes b-drive { 0%{transform:translateX(-95px)} 100%{transform:translateX(285px)} }

      @media (prefers-reduced-motion: reduce) {
        .b-sun,.b-plant,.b-truck { animation:none; }
        .b-plant { transform:none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg class="scene" viewBox="0 0 260 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Sol -->
          <circle class="b-sun" cx="228" cy="26" r="12" fill="#f3c049"/>

          <!-- Chão do campo -->
          <line x1="6" y1="116" x2="176" y2="116" stroke="#3a4a33" stroke-width="2" stroke-linecap="round"/>

          <!-- Plantas a crescer -->
          <g class="b-plant p1">
            <line x1="96" y1="116" x2="96" y2="102" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="92" cy="103" rx="4" ry="2.4" fill="#7cc47c" transform="rotate(-35 92 103)"/>
            <ellipse cx="100" cy="103" rx="4" ry="2.4" fill="#7cc47c" transform="rotate(35 100 103)"/>
          </g>
          <g class="b-plant p2">
            <line x1="112" y1="116" x2="112" y2="100" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="108" cy="101" rx="4" ry="2.4" fill="#7cc47c" transform="rotate(-35 108 101)"/>
            <ellipse cx="116" cy="101" rx="4" ry="2.4" fill="#7cc47c" transform="rotate(35 116 101)"/>
          </g>
          <g class="b-plant p3">
            <line x1="128" y1="116" x2="128" y2="103" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="124" cy="104" rx="4" ry="2.4" fill="#7cc47c" transform="rotate(-35 124 104)"/>
            <ellipse cx="132" cy="104" rx="4" ry="2.4" fill="#7cc47c" transform="rotate(35 132 104)"/>
          </g>

          <!-- Agricultor a capinar -->
          <g>
            <!-- pernas -->
            <line x1="46" y1="116" x2="49" y2="104" stroke="#3a4a33" stroke-width="3" stroke-linecap="round"/>
            <line x1="54" y1="116" x2="51" y2="104" stroke="#3a4a33" stroke-width="3" stroke-linecap="round"/>
            <!-- corpo -->
            <rect x="44" y="86" width="12" height="20" rx="5" fill="#2f6a2d"/>
            <!-- cabeça -->
            <circle cx="50" cy="80" r="6" fill="#c68a5b"/>
            <!-- chapéu de palha -->
            <ellipse cx="50" cy="75" rx="10" ry="2.6" fill="#b7791f"/>
            <path d="M44 75 Q50 68 56 75 Z" fill="#c8912a"/>
            <!-- braço + enxada (capina) -->
            <g>
              <line x1="53" y1="90" x2="66" y2="96" stroke="#c68a5b" stroke-width="3" stroke-linecap="round"/>
              <line x1="66" y1="96" x2="80" y2="82" stroke="#8a5a2b" stroke-width="2.5" stroke-linecap="round"/>
              <rect x="79" y="78" width="7" height="4" rx="1" fill="#cbd5c0" transform="rotate(30 79 78)"/>
              <animateTransform attributeName="transform" type="rotate"
                values="-16 53 90; 24 53 90; -16 53 90" dur="1.2s" repeatCount="indefinite" calcMode="spline"
                keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
            </g>
          </g>

          <!-- Estrada (primeiro plano) -->
          <line x1="0" y1="134" x2="260" y2="134" stroke="#2c3227" stroke-width="10"/>
          <line x1="0" y1="134" x2="260" y2="134" stroke="#4a5542" stroke-width="1.5" stroke-dasharray="10 10"/>

          <!-- Camião a levar a colheita -->
          <g class="b-truck">
            <!-- carga (produtos) -->
            <rect x="6" y="116" width="26" height="12" rx="2" fill="#93c264"/>
            <circle cx="12" cy="116" r="3" fill="#7cc47c"/><circle cx="19" cy="115" r="3.2" fill="#8fbf5e"/><circle cx="26" cy="116" r="3" fill="#7cc47c"/>
            <!-- caixa/atrelado -->
            <rect x="4" y="118" width="30" height="12" rx="2" fill="#2f6a2d"/>
            <!-- cabine -->
            <rect x="34" y="120" width="14" height="10" rx="2" fill="#cbd5c0"/>
            <rect x="37" y="122" width="7" height="5" rx="1" fill="#12150f"/>
            <!-- rodas -->
            <circle cx="13" cy="132" r="3.5" fill="#1a1a1a"/>
            <circle cx="26" cy="132" r="3.5" fill="#1a1a1a"/>
            <circle cx="42" cy="132" r="3.5" fill="#1a1a1a"/>
          </g>
        </svg>
        <div class="n">Agro<b>Conecta</b></div>
        <div class="t">A preparar o terreno…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
