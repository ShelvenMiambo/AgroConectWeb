<!DOCTYPE html>
<html lang="pt-MZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO -->
    <title>AgroConecta: Terrenos, produção e negócios agrícolas em Moçambique</title>

    <meta name="keywords" content="agricultura, Moçambique, marketplace, terras, cultivo, agronegócio, assistente agrícola" />

    <!-- Partilha em redes sociais (WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgroConecta" />
    <meta property="og:locale" content="pt_MZ" />
    <meta property="og:url" content="https://agroconecta.pages.dev/" />
    <meta property="og:title" content="AgroConecta: agricultura ligada em Moçambique" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgroConecta: agricultura ligada em Moçambique" />
    <meta name="twitter:description" content="Encontre terra, venda a sua colheita e negoceie em segurança." />
    <meta name="twitter:image" content="https://agroconecta.pages.dev/og-image.jpg" />

    <!-- Dados estruturados (JSON-LD) para os motores de busca -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "AgroConecta",
          "url": "https://agroconecta.pages.dev/",
          "logo": "https://agroconecta.pages.dev/icon-512.png",
          "description": "Plataforma que liga agricultores, donos de terra e compradores em Moçambique: marketplace de terrenos e produtos, assistente agrícola, gestão de produção e negociações.",
          "areaServed": { "@type": "Country", "name": "Moçambique" }
        },
        {
          "@type": "WebSite",
          "name": "AgroConecta",
          "url": "https://agroconecta.pages.dev/",
          "inLanguage": "pt-MZ"
        }
      ]
    }
    </script>

    <!-- Tipos de letra -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Ecrã inicial estático: aparece de imediato (mesmo antes do JavaScript
         carregar, em redes lentas) e é substituído pela app ao arrancar. -->
    <style>
      #boot { position:fixed; inset:0; display:flex; flex-direction:column;
              align-items:center; justify-content:center; gap:14px;
              background:#12150f; color:#e9ebe3; font-family:system-ui,-apple-system,sans-serif; }
      #boot .scene { width:min(320px,88vw); height:auto; }
      #boot .n { font-size:22px; font-weight:800; letter-spacing:-.01em; }
      #boot .n b { color:#93c264; }
      #boot .t { font-size:13px; color:#9aa292; }

      /* Sol a pulsar */
      .b-sun { animation:b-sun 3s ease-in-out infinite; }
      @keyframes b-sun { 0%,100%{opacity:.7} 50%{opacity:1} }

      /* História (ciclo de 9s):
         1) o agricultor SAI do logo (a planta)
         2) capina ali junto ao logo
         3) pega no carrinho de mão e leva a colheita
         4) até ao camião, que parte */
      .b-farmer { animation:b-journey 9s ease-in-out infinite; }
      @keyframes b-journey {
        0%   { opacity:0; transform:translateX(-36px); }   /* dentro do logo */
        7%   { opacity:1; transform:translateX(-36px); }   /* aparece no logo */
        16%  { transform:translateX(0); }                   /* sai para o campo */
        52%  { opacity:1; transform:translateX(0); }        /* a capinar */
        73%  { transform:translateX(120px); }               /* leva o carrinho ao camião */
        84%  { opacity:1; transform:translateX(120px); }
        92%  { opacity:0; transform:translateX(120px); }
        100% { opacity:0; transform:translateX(-36px); }
      }

      /* O regador aparece na fase de rega (início); some quando começa o transporte */
      .b-water { animation:b-water 9s ease-in-out infinite; }
      @keyframes b-water { 0%,50%{opacity:1} 55%,100%{opacity:0} }

      /* O carrinho de mão só aparece depois de regar (fase de transporte) */
      .b-barrow { animation:b-barrow 9s ease-in-out infinite; }
      @keyframes b-barrow { 0%,52%{opacity:0} 58%,90%{opacity:1} 100%{opacity:0} }

      /* O camião parte no fim */
      .b-truck { animation:b-leave 9s ease-in-out infinite; }
      @keyframes b-leave {
        0%   { opacity:0; transform:translateX(0); }
        6%   { opacity:1; }
        82%  { opacity:1; transform:translateX(0); }
        96%  { opacity:1; transform:translateX(90px); }     /* arranca para a direita */
        98%,100% { opacity:0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .b-farmer,.b-barrow,.b-truck,.b-sun { animation:none; }
        .b-farmer,.b-barrow,.b-truck { opacity:1; transform:none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg class="scene" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Sol -->
          <circle class="b-sun" cx="270" cy="24" r="11" fill="#f3c049"/>

          <!-- Chão -->
          <line x1="8" y1="120" x2="292" y2="120" stroke="#3a4a33" stroke-width="2" stroke-linecap="round"/>

          <!-- LOGO (a planta) — o agricultor sai daqui -->
          <g>
            <rect x="14" y="62" width="42" height="42" rx="12" fill="#1e5c1e"/>
            <line x1="22" y1="96" x2="48" y2="96" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            <line x1="27" y1="100" x2="43" y2="100" stroke="#7cc47c" stroke-width="2" stroke-linecap="round"/>
            <line x1="35" y1="96" x2="35" y2="82" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="35" cy="79" rx="3.2" ry="6" fill="#ffffff"/>
            <ellipse cx="40" cy="84" rx="2.4" ry="5" fill="#7cc47c" transform="rotate(40 40 84)"/>
            <ellipse cx="30" cy="84" rx="2.4" ry="5" fill="#7cc47c" transform="rotate(-40 30 84)"/>
          </g>

          <!-- CAMIÃO (parte no fim) -->
          <g class="b-truck">
            <rect x="208" y="99" width="26" height="8" rx="2" fill="#93c264"/>
            <circle cx="214" cy="100" r="3" fill="#7cc47c"/><circle cx="221" cy="99" r="3.2" fill="#8fbf5e"/><circle cx="228" cy="100" r="3" fill="#7cc47c"/>
            <rect x="206" y="104" width="30" height="14" rx="2" fill="#2f6a2d"/>
            <rect x="236" y="106" width="14" height="12" rx="2" fill="#cbd5c0"/>
            <rect x="239" y="108" width="7" height="5" rx="1" fill="#12150f"/>
            <circle cx="214" cy="120" r="4" fill="#1a1a1a"/>
            <circle cx="228" cy="120" r="4" fill="#1a1a1a"/>
            <circle cx="244" cy="120" r="4" fill="#1a1a1a"/>
          </g>

          <!-- AGRICULTOR (sai do logo, capina, leva o carrinho) -->
          <g class="b-farmer">
            <!-- carrinho de mão (aparece na fase de transporte) -->
            <g class="b-barrow">
              <line x1="78" y1="106" x2="72" y2="102" stroke="#8a5a2b" stroke-width="2" stroke-linecap="round"/>
              <polygon points="78,104 100,104 96,114 82,114" fill="#2f6a2d"/>
              <circle cx="86" cy="102" r="2.6" fill="#93c264"/><circle cx="92" cy="101" r="2.8" fill="#8fbf5e"/><circle cx="97" cy="102" r="2.6" fill="#7cc47c"/>
              <circle cx="88" cy="117" r="4" fill="#1a1a1a"/>
            </g>
            <!-- pernas -->
            <line x1="62" y1="120" x2="65" y2="106" stroke="#3a4a33" stroke-width="3" stroke-linecap="round"/>
            <line x1="72" y1="120" x2="69" y2="106" stroke="#3a4a33" stroke-width="3" stroke-linecap="round"/>
            <!-- corpo -->
            <rect x="60" y="88" width="12" height="20" rx="5" fill="#2f6a2d"/>
            <!-- cabeça -->
            <circle cx="66" cy="82" r="6" fill="#c68a5b"/>
            <!-- chapéu de palha -->
            <ellipse cx="66" cy="77" rx="10" ry="2.6" fill="#b7791f"/>
            <path d="M60 77 Q66 70 72 77 Z" fill="#c8912a"/>
            <!-- braço + regador (rega a planta do logo, à esquerda) -->
            <g class="b-water">
              <line x1="62" y1="91" x2="50" y2="93" stroke="#c68a5b" stroke-width="3" stroke-linecap="round"/>
              <!-- regador -->
              <rect x="42" y="88" width="9" height="8" rx="2" fill="#b9c2ad"/>
              <path d="M50 89 q4 -1 4 3" fill="none" stroke="#b9c2ad" stroke-width="2"/>
              <line x1="42" y1="90" x2="35" y2="87" stroke="#b9c2ad" stroke-width="2.5" stroke-linecap="round"/>
              <!-- gotas de água a cair sobre a planta -->
              <circle cx="34" cy="90" r="1.4" fill="#7cbfe0">
                <animate attributeName="cy" values="89;99" dur="0.9s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="1;1;0" dur="0.9s" repeatCount="indefinite"/>
              </circle>
              <circle cx="37" cy="90" r="1.2" fill="#7cbfe0">
                <animate attributeName="cy" values="89;99" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="1;1;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
              </circle>
              <circle cx="31" cy="90" r="1.2" fill="#7cbfe0">
                <animate attributeName="cy" values="89;99" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="1;1;0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
              </circle>
            </g>
          </g>
        </svg>
        <div class="n">Agro<b>Conecta</b></div>
        <div class="t">A preparar o terreno…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
